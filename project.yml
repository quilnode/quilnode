name: QuilNode

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  QuilNodeShared:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/QuilNodeShared
    settings:
      base:
        PRODUCT_NAME: QuilNodeShared
        SKIP_INSTALL: YES

  QuilNodeCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/QuilNodeCore
    dependencies:
      - target: QuilNodeShared
    settings:
      base:
        PRODUCT_NAME: QuilNodeCore
        SKIP_INSTALL: YES

  QuilNodeHelperKit:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/QuilNodeHelperKit
    dependencies:
      - target: QuilNodeShared
    settings:
      base:
        PRODUCT_NAME: QuilNodeHelperKit
        SKIP_INSTALL: YES

  QuilNodeHelperCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/QuilNodeHelperCLI
    dependencies:
      - target: QuilNodeHelperKit
      # Xcode static-library dependencies are not transitively linked into tools.
      # Keep Shared explicit here even though the CLI imports only HelperKit.
      - target: QuilNodeShared
    settings:
      base:
        PRODUCT_NAME: QuilNodeHelper
        SKIP_INSTALL: YES

  QuilNode:
    type: application
    platform: macOS
    sources:
      - path: Sources/QuilNodeApp
      - path: Resources/Assets.xcassets
        buildPhase: resources
    resources:
      - path: Resources/AppIcon.icns
      - path: Resources/Credits.rtf
    dependencies:
      - target: QuilNodeCore
      - target: QuilNodeShared
      - package: Sparkle
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: QuilNode
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "110"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 QuilNode contributors. AGPL-3.0-only.
        SUFeedURL: https://raw.githubusercontent.com/quilnode/quilnode/release-feed/appcast.xml
        SUPublicEDKey: DJIxXBjq/gVQx7fUypBouvqtsS1Qx7SKvBUAi/yKZp8=
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        SUSignedFeedFailureExpirationInterval: 0
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Resources/QuilNode.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quilnode.app
        PRODUCT_NAME: QuilNode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  QuilNode:
    build:
      targets:
        QuilNode: all
    run:
      config: Debug
    archive:
      config: Release
  QuilNodeHelper:
    build:
      targets:
        QuilNodeHelperCLI: all
    run:
      config: Debug
    archive:
      config: Release
